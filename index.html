<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <title>Riski Andriyanto – Portfolio</title>
  <meta name="description" content="Riski Andriyanto's Portfolio" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />

  <!-- Open Graph Meta -->
  <meta property="og:title" content="Riski Andriyanto – Portfolio" />
  <meta property="og:description" content="Programmer | Backend & Fullstack Developer" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://andrizan.com" />

  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.min.js"></script>

  <!-- Ioskeley Mono (OFL-1.1): https://github.com/ahatem/IoskeleyMono -->
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/ahatem/IoskeleyMono@v2.2.0/site/fonts/IoskeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face {
      font-family: "Ioskeley Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("https://cdn.jsdelivr.net/gh/ahatem/IoskeleyMono@v2.2.0/site/fonts/IoskeleyMono-Regular.woff2") format("woff2");
    }

    @font-face {
      font-family: "Ioskeley Mono";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("https://cdn.jsdelivr.net/gh/ahatem/IoskeleyMono@v2.2.0/site/fonts/IoskeleyMono-Bold.woff2") format("woff2");
    }

    @font-face {
      font-family: "Ioskeley Mono";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("https://cdn.jsdelivr.net/gh/ahatem/IoskeleyMono@v2.2.0/site/fonts/IoskeleyMono-Italic.woff2") format("woff2");
    }

    /* Palette after arm.jonpalmisc.com: every text/background pair is >= 4.5:1 (WCAG 2.2 AA) */
    :root {
      color-scheme: light dark;
      --fg: #000;
      --bg: #fff;
      --bg-secondary: #f2f2f2;
      --bg-hint: #f8f0d0;
      --accent: #0031a9;
      --selection: #efdfff;
      /* em: resolves against the font size of the element that uses it */
      --pad: 1.2em;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #fff;
        --bg: #000;
        --bg-secondary: #100f10;
        --bg-hint: #381d0f;
        --accent: #2fafff;
        --selection: #4f3d88;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    ::selection { background: var(--selection); }

    @keyframes navigation-flash {
      from { background: var(--bg-hint); }
      to { background: transparent; }
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      :target { animation: navigation-flash 2s; }
    }

    body {
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr);
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Ioskeley Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.8125rem;
      line-height: 1.4;
    }

    a { color: var(--accent); }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      z-index: 10;
      padding: calc(var(--pad) / 1.5) var(--pad);
      border: 1px solid var(--fg);
      background: var(--bg-hint);
      color: var(--fg);
      font-weight: 700;
      transform: translateY(-200%);
    }

    .skip-link:focus { transform: none; }

    .note {
      padding: calc(var(--pad) / 1.5) var(--pad);
      border: 1px solid var(--fg);
      background: var(--bg-hint);
    }

    /* TOC */
    .toc {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100dvh;
      overflow-y: auto;
      padding: var(--pad);
      border-right: 1px dashed var(--fg);
      background: var(--bg);
    }

    .toc-title {
      margin: 0 0 calc(var(--pad) / 2);
      font-weight: 700;
      text-transform: uppercase;
    }

    .toc-toggle { display: none; }

    .toc ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc a {
      display: block;
      padding: 0.125em 1ch;
    }

    .toc li[data-level="2"]:not(:first-child) { margin-top: calc(var(--pad) / 2); }

    .toc li[data-level="3"] a { padding-left: 3ch; }

    .toc a[aria-current="location"] {
      background: var(--bg-hint);
      font-weight: 700;
    }

    /* Content */
    main { padding: var(--pad); }

    main:focus { outline: none; }

    #content {
      max-width: 60em;
      margin-inline: auto;
      overflow-wrap: anywhere;
    }

    #content img {
      max-width: 100%;
      height: auto;
    }

    #content h1,
    #content h2,
    #content h3 { margin: 3em 0 0.5em; }

    #content h1 {
      margin-top: 1em;
      font-size: 1.73em;
    }

    #content h2 {
      font-size: 1.44em;
      text-transform: uppercase;
    }

    #content h3 { font-size: 1.22em; }

    #content p { margin: var(--pad) 0; }

    #content hr {
      margin: calc(var(--pad) * 4) 0 var(--pad);
      border: none;
      border-top: 1px dashed var(--fg);
    }

    #content ul {
      margin: 0;
      padding-left: calc(var(--pad) * 2);
    }

    #content li { margin: calc(var(--pad) / 2) 0; }

    #content li::marker { content: "* "; }

    /* Mobile style */
    @media (max-width: 48rem) {
      html { scroll-padding-top: 5rem; }

      body { display: block; }

      .toc {
        position: sticky;
        z-index: 5;
        height: auto;
        max-height: 100dvh;
        padding: calc(var(--pad) / 1.5) var(--pad);
        border-right: 0;
        border-bottom: 1px dashed var(--fg);
      }

      .toc-title { display: none; }

      .toc-toggle {
        display: flex;
        align-items: center;
        gap: 1ch;
        width: 100%;
        min-height: 2.75rem;
        padding: calc(var(--pad) / 2) var(--pad);
        border: 1px solid var(--fg);
        border-radius: 0;
        background: var(--bg-secondary);
        color: var(--fg);
        font: inherit;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
      }

      .toc.collapsed ul { display: none; }

      .toc ul { margin-top: calc(var(--pad) / 2); }
    }

    @media print {
      .toc, .skip-link { display: none; }
      body { display: block; }
      main { padding: 0; }
      h2, h3 { break-after: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <nav id="toc" class="toc collapsed" aria-label="Table of contents">
    <button type="button" class="toc-toggle" aria-expanded="false" aria-controls="toc-list">
      <span aria-hidden="true">☰</span> Table of Contents
    </button>
    <p class="toc-title" aria-hidden="true">Table of Contents</p>
    <ul id="toc-list"></ul>
  </nav>

  <main id="main" tabindex="-1">
    <div id="content" aria-busy="true">
      <noscript><p class="note">This page renders my README with JavaScript. <a href="https://github.com/andrizan">View it on GitHub</a> instead.</p></noscript>
    </div>
  </main>

  <script>
    async function loadMarkdown() {
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('README.md');
        if (!res.ok) throw new Error('Failed to load README (' + res.status + ')');
        const mdText = await res.text();
        contentEl.innerHTML = marked.parse(mdText);
        assignIds();
        structure(contentEl);
        buildToc();
        trackActiveSection();
      } catch (err) {
        contentEl.innerHTML = '<p role="alert" class="note">Unable to load README content. <a href="https://github.com/andrizan">View it on GitHub</a> instead.</p>';
        console.error(err);
      } finally {
        contentEl.removeAttribute('aria-busy');
      }
    }

    function assignIds() {
      document.querySelectorAll('#content h1, #content h2, #content h3').forEach(h => {
        h.id = h.textContent.trim().toLowerCase().replace(/\s+/g, '-');
      });
    }

    // Wrap rendered markdown: intro -> <header>, each h2 -> <section>
    function structure(root) {
      const header = document.createElement('header');
      const frag = document.createDocumentFragment();
      frag.append(header);
      let section = null;

      for (const el of [...root.children]) {
        if (el.tagName === 'H2') {
          section = document.createElement('section');
          section.setAttribute('aria-labelledby', el.id);
          frag.append(section);
        }
        (section || header).append(el);
      }
      root.replaceChildren(frag);
    }

    function buildToc() {
      const headings = document.querySelectorAll('#content h2, #content h3');
      const tocUl = document.querySelector('#toc ul');
      tocUl.innerHTML = "";

      headings.forEach(h => {
        const li = document.createElement('li');
        li.dataset.level = h.tagName[1];
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        tocUl.appendChild(li);
      });
    }

    // Mark the TOC link of the section being read with aria-current
    function trackActiveSection() {
      const root = document.documentElement;
      const headings = [...document.querySelectorAll('#content h2, #content h3')];
      const tocList = document.getElementById('toc-list');
      const links = new Map([...tocList.querySelectorAll('a')].map(a => [a.getAttribute('href').slice(1), a]));
      let current = null, lockUntil = 0, queued = false;

      function setCurrent(id) {
        if (id === current) return;
        current = id;
        links.forEach((a, key) => {
          if (key === id) a.setAttribute('aria-current', 'location');
          else a.removeAttribute('aria-current');
        });
      }

      function update() {
        queued = false;
        if (performance.now() < lockUntil) return;
        const rem = parseFloat(getComputedStyle(root).fontSize);
        const vh = window.innerHeight;
        const top = (parseFloat(getComputedStyle(root).scrollPaddingTop) || 0) + 3 * rem;
        // Headings near the page end can't reach the top line, so over the last
        // half viewport of scrolling the line moves down to the viewport bottom
        const max = root.scrollHeight - vh;
        const ramp = max > 0 ? Math.min(1, Math.max(0, 1 - (max - window.scrollY) / (vh / 2))) : 0;
        const line = top + ramp * (vh - top);
        let active = null;
        for (const h of headings) {
          if (h.getBoundingClientRect().top > line) break;
          active = h;
        }
        setCurrent(active && active.id);
      }

      function schedule() {
        if (queued) return;
        queued = true;
        requestAnimationFrame(update);
      }

      // A clicked link stays current while the page scrolls to its section
      tocList.addEventListener('click', e => {
        const a = e.target.closest('a');
        if (!a) return;
        setCurrent(a.getAttribute('href').slice(1));
        lockUntil = performance.now() + 1200;
      });
      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);
      schedule();
    }

    // Toggle for mobile
    function setTocCollapsed(collapsed) {
      const toc = document.getElementById('toc');
      toc.classList.toggle('collapsed', collapsed);
      toc.querySelector('button').setAttribute('aria-expanded', String(!collapsed));
    }

    const tocEl = document.getElementById('toc');
    tocEl.querySelector('button').addEventListener('click', () => {
      setTocCollapsed(!tocEl.classList.contains('collapsed'));
    });
    tocEl.querySelector('ul').addEventListener('click', e => {
      if (e.target.closest('a')) setTocCollapsed(true);
    });

    window.addEventListener('DOMContentLoaded', loadMarkdown);
  </script>
</body>
</html>
